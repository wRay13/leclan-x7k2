<script>
'use strict';
/* ---------- Outils ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const toInput = d => `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const JOURS = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
const fmtDay = s => { if (!s) return ''; const [y, m, d] = s.slice(0, 10).split('-'); return `${d}/${m}/${y}`; };
const fmtDT = s => { if (!s) return ''; const d = new Date(s); return `${JOURS[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth() + 1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtFull = s => { if (!s) return ''; const d = new Date(s); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const mondayOf = d => { const x = new Date(d); const k = (x.getDay() + 6) % 7; x.setDate(x.getDate() - k); return ymd(x); };
/* Icônes (traits arrondis, couleur héritée du texte) */

const ic = (n, c = '') => `<svg class="ic ${c}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`;
function toast(msg, warn) {
  const t = $('#toast'); t.innerHTML = ic(warn ? 'lock' : 'check') + '<span>' + esc(String(msg).replace(/\s*✓$/, '')) + '</span>';
  t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ---------- Stockage (IndexedDB, sur la tablette) ---------- */
const idb = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('haccp-resto', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('photos'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (store, mode, fn) => { const db = await open(); return new Promise((res, rej) => {
    const t = db.transaction(store, mode); const rq = fn(t.objectStore(store));
    t.oncomplete = () => res(rq && rq.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); };
  return {
    get: (s, k) => tx(s, 'readonly', o => o.get(k)),
    set: (s, k, v) => tx(s, 'readwrite', o => o.put(v, k)),
    del: (s, k) => tx(s, 'readwrite', o => o.delete(k)),
    keys: s => tx(s, 'readonly', o => o.getAllKeys()),
    clear: s => tx(s, 'readwrite', o => o.clear()),
  };
})();

const DEFAULTS = () => ({
  version: 1, name: 'Le Clan', staff: [], currentUser: '', lastBackup: '', labels: [], stock: [], moves: [], profiles: [], born: {}, bornInit: false, audit: [],
  products: [
    ['Plat cuisiné maison (refroidi)', 3], ['Sauce / fond maison', 3], ['Crudités préparées', 2], ['Viande cuite', 3],
    ['Viande crue portionnée', 2], ['Poisson cru préparé', 1], ['Produit décongelé', 3], ['Charcuterie entamée', 3],

  ].map(([name, days]) => ({ id: uid(), name, days })),
  suppliers: [],
  tasks: [
    ['Plans de travail', 'Cuisine', 'daily'], ['Planches, couteaux, petit matériel', 'Cuisine', 'daily'], ['Sols', 'Cuisine', 'daily'],
    ['Plonge et lave-vaisselle', 'Plonge', 'daily'], ['Poubelles (vidage + lavage)', 'Cuisine', 'daily'],
    ['Poignées et points de contact', 'Cuisine', 'daily'], ['Sanitaires', 'Sanitaires', 'daily'],
    ['Frigos / chambre froide (intérieur)', 'Froid', 'weekly'], ['Filtres de hotte', 'Cuisine', 'weekly'], ['Fours', 'Cuisine', 'weekly'],
    ['Friteuse : contrôle / changement de l\'huile', 'Cuisine', 'weekly'], ['Étagères réserve sèche', 'Réserve', 'weekly'],
    ['Congélateurs (dégivrage, nettoyage)', 'Froid', 'monthly'], ['Murs et plafonds', 'Cuisine', 'monthly'], ['Siphons et évacuations', 'Cuisine', 'monthly'],
  ].map(([name, zone, freq]) => ({ id: uid(), name, zone, freq })),
  dlc: [], receptions: [], cleanLog: [],
  equip: [['Réfrigérateur 1', 'cold', 4], ['Chambre froide', 'cold', 4], ['Congélateur', 'frozen', -18]].map(([name, kind, limit]) => ({ id: uid(), name, kind, limit })),
  tempRules: [['Produit frais très périssable', 'max', 4], ['Préparation culinaire élaborée à l\'avance', 'max', 3], ['Denrée périssable d\'origine non animale', 'max', 8], ['Surgelé / congelé', 'max', -18], ['Sec / ambiant (pas de contrôle)', 'none', 0]].map(([name, type, limit]) => ({ id: uid(), name, type, limit })),
  temps: [], cooling: [], oil: [], dishes: [],
});
let S = DEFAULTS();
const ui = { view: 'home', search: '', labSearch: '', labDays: 7, stockSearch: '', stockCat: '', tempTab: 'eq', allSearch: '', reg: 'dlc', from: ymd(addDays(new Date(), -30)), to: ymd(new Date()) };
let saveErr = false;
// Date réelle de création de chaque enregistrement (indépendante de la date saisie, qui peut être modifiée).
// Sert à la fenêtre de correction : suppression possible dans les CORRECTION_HOURS heures qui suivent.
const REG_KEYS = ['dlc', 'receptions', 'cleanLog', 'labels', 'temps', 'cooling', 'oil'];
const CORRECTION_HOURS = 24;
function stampBorn() {
  if (!S.born) S.born = {}; if (!S.audit) S.audit = [];
  const legacy = !S.bornInit;   // enregistrements antérieurs à cette fonction : on retient leur propre date
  for (const k of REG_KEYS) for (const it of S[k] || []) {
    if (S.born[it.id]) continue;
    const own = new Date(it.at || it.madeAt || it.startAt).getTime();
    S.born[it.id] = legacy && !isNaN(own) ? own : Date.now();
  }
  S.bornInit = true;
}
// Suppression d'un enregistrement : libre dans les CORRECTION_HOURS h (motif obligatoire), verrouillée ensuite jusqu'à RETENTION_DAYS jours.
function removeRecord(key, id, regName, desc) {
  const it = (S[key] || []).find(x => x.id === id); if (!it) return;
  const born = new Date((S.born || {})[it.id] || Date.now()), age = Date.now() - born;
  const recent = age <= CORRECTION_HOURS * 36e5, old = age >= RETENTION_DAYS * 864e5;
  if (!recent && !old) return alert(`Suppression impossible : une erreur ne peut être corrigée que dans les ${CORRECTION_HOURS} h qui suivent l'enregistrement. Ensuite, les enregistrements de traçabilité sont conservés ${RETENTION_DAYS / 30} mois (suppression possible à partir du ${fmtDay(ymd(addDays(born, RETENTION_DAYS)))}).`);
  let reason = '';
  if (recent) {
    reason = (prompt(`Correction d'une erreur de saisie. Motif de la suppression (obligatoire) :\n${desc}`) || '').trim();
    if (!reason) return toast('Suppression annulée : motif obligatoire', true);
  } else if (!confirm('Supprimer définitivement cet enregistrement du registre ?')) return;
  if (it.photoId) { idb.del('photos', it.photoId); idb.del('photos', 't_' + it.photoId); }
  S.audit.push({ id: uid(), at: toInput(new Date()), by: S.currentUser, reg: regName, desc, reason: reason || 'Fin de la durée de conservation' });
  S[key] = S[key].filter(x => x.id !== id); delete S.born[id]; commit('Supprimé');
}
async function save() {
  try { stampBorn(); await idb.set('kv', 'state', S); saveErr = false; }
  catch (e) { saveErr = true; console.error(e); alert('Attention : l\'enregistrement a échoué (' + e + '). Faites une sauvegarde depuis Réglages.'); }
}
async function commit(msg) { await save(); render(); if (msg && !saveErr) toast(msg); }

/* ---------- Logique métier ---------- */
const TYPES = ['Ouverture', 'Préparation maison', 'Décongélation', 'Mise sous vide', 'Autre'];
const FREQ = { daily: 'Chaque jour', weekly: 'Chaque semaine', monthly: 'Chaque mois' };
const ST_LABEL = { expired: 'Périmé', today: 'Expire aujourd\'hui', soon: 'Expire demain', ok: 'OK' };
function computeExp(madeAt, dur, unit) {
  const d = new Date(madeAt); if (isNaN(d) || !(dur >= 0)) return '';
  if (unit === 'h') return toInput(new Date(d.getTime() + dur * 3600e3));
  const x = addDays(d, Number(dur)); x.setHours(23, 59, 0, 0); return toInput(x);
}
function dlcStatus(e) {
  const x = new Date(e.expiresAt), now = new Date();
  if (x < now) return 'expired';
  if (ymd(x) === ymd(now)) return 'today';
  if (ymd(x) === ymd(addDays(now, 1))) return 'soon';
  return 'ok';
}
const activeDlc = () => S.dlc.filter(e => e.status === 'active').sort((a, b) => a.expiresAt.localeCompare(b.expiresAt));
function taskLog(t, now = new Date()) {
  const today = ymd(now);
  const from = t.freq === 'daily' ? today : t.freq === 'weekly' ? mondayOf(now) : today.slice(0, 7) + '-01';
  return S.cleanLog.find(l => l.taskId === t.id && l.date >= from && l.date <= today);
}
function needUser() { if (S.currentUser) return true; actions.pickUser(); return false; }
/* ---------- Profils et mots de passe ---------- */
let role = '';
const isAdmin = () => role === 'admin';

/* ---------- Droits par catégorie ---------- */
let perms = {};
const CATS = [['dlc', 'Datation'], ['lab', 'Étiquettes'], ['rec', 'Réception'], ['stock', 'Stock'], ['temp', 'Températures'], ['clean', 'Nettoyage'], ['all', 'Allergènes'], ['reg', 'Registre']];
const LEVELS = [['none', 'Aucun accès'], ['view', 'Lecture seule'], ['edit', 'Saisie']];
const RANK = { none: 0, view: 1, edit: 2 };
const ALL_EDIT = () => Object.fromEntries(CATS.map(([k]) => [k, 'edit']));
const LEGACY = { dlc: 'edit', lab: 'edit', rec: 'edit', stock: 'edit', temp: 'edit', clean: 'edit', all: 'view', reg: 'view' };
const PRESETS = {
  resp: ['Responsable de cuisine', { dlc: 'edit', lab: 'edit', rec: 'edit', stock: 'edit', temp: 'edit', clean: 'edit', all: 'edit', reg: 'view' }],
  cuisine: ['Cuisinier', { dlc: 'edit', lab: 'edit', rec: 'edit', stock: 'edit', temp: 'edit', clean: 'edit', all: 'view', reg: 'none' }],
  commis: ['Commis / aide de cuisine', { dlc: 'edit', lab: 'edit', rec: 'none', stock: 'view', temp: 'edit', clean: 'edit', all: 'view', reg: 'none' }],
  plonge: ['Plonge / entretien', { dlc: 'none', lab: 'none', rec: 'none', stock: 'none', temp: 'none', clean: 'edit', all: 'none', reg: 'none' }],
  salle: ['Salle / service', { dlc: 'view', lab: 'none', rec: 'none', stock: 'view', temp: 'none', clean: 'edit', all: 'view', reg: 'none' }],
};
const permsOf = p => p.role === 'admin' ? ALL_EDIT() : { ...LEGACY, ...(p.perms || {}) };
const can = (cat, lvl = 'view') => isAdmin() || RANK[perms[cat] || 'none'] >= RANK[lvl];
const CATV = { dlc: 'dlc', lab: 'lab', rec: 'rec', stock: 'stock', temp: 'temp', clean: 'clean', all: 'all', reg: 'reg' };
// Droit requis par action : [catégorie, niveau] ou 'admin'. Ce qui n'est pas listé est libre.
const NEED = {
  newDlc: ['dlc', 'edit'], closeDlc: ['dlc', 'edit'], labShoot: ['lab', 'edit'], newRec: ['rec', 'edit'],
  newStock: ['stock', 'edit'], stockMove: ['stock', 'edit'], toggleTask: ['clean', 'edit'],
  newReading: ['temp', 'edit'], startCool: ['temp', 'edit'], endCool: ['temp', 'edit'], newOil: ['temp', 'edit'],
  newDish: ['all', 'edit'], delDish: ['all', 'edit'], csv: ['reg', 'view'], print: ['reg', 'view'], printAll: ['all', 'view'],
  delRow: 'admin', delLabel: 'admin', delStock: 'admin', backup: 'admin', rename: 'admin', newProfile: 'admin', delProfile: 'admin', editPerms: 'admin',
  editProduct: 'admin', delProduct: 'admin', editTask: 'admin', delTask: 'admin', delSupplier: 'admin',
  editEquip: 'admin', delEquip: 'admin', editRule: 'admin', delRule: 'admin',
};
function allowed(act, d = {}) {
  if (act === 'go') return !CATV[d.v] || can(CATV[d.v]);
  const n = NEED[act]; if (!n) return true;
  return n === 'admin' ? isAdmin() : can(n[0], n[1]);
}
// Retire de l'écran les boutons que le profil n'a pas le droit d'utiliser.
function applyPerms(root) {
  root.querySelectorAll('[data-act]').forEach(el => {
    if (allowed(el.dataset.act, el.dataset)) return;
    if (el.classList.contains('task')) { el.removeAttribute('data-act'); el.disabled = true; el.style.cursor = 'default'; } else el.remove();
  });
}
const permPills = p => p.role === 'admin' ? '<span class="pill ok">Tous les droits</span>' :
  (CATS.map(([k, l]) => { const lv = permsOf(p)[k] || 'none'; return lv === 'none' ? '' : `<span class="pill ${lv === 'edit' ? 'ok' : 'view'}">${l}${lv === 'view' ? ' (lecture)' : ''}</span>`; }).join('') || '<span class="pill soon">Aucun accès</span>');
const permFields = cur => CATS.map(([k, l]) => ({ name: 'p_' + k, label: l, type: 'select', options: LEVELS, value: cur[k] || 'none', half: true }));
const readPerms = v => Object.fromEntries(CATS.map(([k]) => [k, v['p_' + k] || 'none']));
const presetField = () => ({ name: 'preset', label: 'Modèle de profil', hint: 'pré-remplit les droits ci-dessous', type: 'select', options: [['', 'Personnalisé'], ...Object.entries(PRESETS).map(([k, v]) => [k, v[0]])], value: '' });
function presetInput(f, ev) { if (ev.target.name === 'preset' && PRESETS[ev.target.value]) Object.entries(PRESETS[ev.target.value][1]).forEach(([k, lv]) => { f['p_' + k].value = lv; }); }
function roleInput(f) { CATS.forEach(([k]) => { f['p_' + k].disabled = f.role.value === 'admin'; }); }
const PW_ATTRS = 'autocomplete="new-password" minlength="4"';
async function hashPw(pw, salt) {
  if (!(window.crypto && crypto.subtle)) { alert('Les mots de passe nécessitent une adresse sécurisée (https).'); throw new Error('crypto indisponible'); }
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pw));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function makePw(pw) { const salt = uid() + uid(); return { salt, hash: await hashPw(pw, salt) }; }
// La session survit à un rechargement de la page (sessionStorage), mais pas à la fermeture de l'application.
function setSession(p) {
  S.currentUser = p.name; role = p.role; perms = permsOf(p);
  try { sessionStorage.setItem('haccp-session', p.id); } catch (e) {}
}
function restoreSession() {
  try {
    const p = S.profiles.find(x => x.id === sessionStorage.getItem('haccp-session'));
    if (p && p.hash) { S.currentUser = p.name; role = p.role; perms = permsOf(p); }
  } catch (e) {}
}
function lock() { try { sessionStorage.removeItem('haccp-session'); } catch (e) {} S.currentUser = ''; role = ''; perms = {}; ui.view = 'home'; if ($('#dlg').open) $('#dlg').close(); render(); actions.pickUser(); }

/* ---------- Fenêtre de saisie générique ---------- */
function field(f) {
  const a = `name="${f.name}" ${f.required ? 'required' : ''} ${f.attrs || ''}`;
  const lab = `${esc(f.label)}${f.hint ? ` <span class="h">– ${esc(f.hint)}</span>` : ''}`;
  let inp;
  if (f.type === 'select') inp = `<select ${a}>${f.options.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(v) === String(f.value ?? '') ? 'selected' : ''}>${esc(l)}</option>`; }).join('')}</select>`;
  else if (f.type === 'textarea') inp = `<textarea ${a}>${esc(f.value)}</textarea>`;
  else if (f.type === 'photo') inp = `<input type="file" accept="image/*" capture="environment" name="${f.name}">`;
  else inp = `<input type="${f.type || 'text'}" ${a} value="${esc(f.value)}" ${f.list ? `list="dl-${f.name}"` : ''} autocomplete="off">` +
    (f.list ? `<datalist id="dl-${f.name}">${f.list.map(v => `<option value="${esc(v)}">`).join('')}</datalist>` : '');
  return `<label class="f">${lab}${inp}</label>`;
}
function openForm({ title, fields = [], html = '', okLabel = 'Enregistrer', submit, onInput, cancel = true, cancelLabel = 'Annuler' }) {
  const dlg = $('#dlg');
  const rows = []; let i = 0;
  while (i < fields.length) {
    if (fields[i].half && fields[i + 1] && fields[i + 1].half) { rows.push(`<div class="two">${field(fields[i])}${field(fields[i + 1])}</div>`); i += 2; }
    else rows.push(field(fields[i++]));
  }
  dlg.innerHTML = `<form method="dialog"><h2>${esc(title)}</h2><div class="scroll">${html}${rows.join('')}</div>
    <div class="foot">${cancel ? `<button type="button" class="btn" data-act="closeDlg">${esc(cancelLabel)}</button>` : ''}
    ${submit ? `<button type="submit" class="btn pri">${esc(okLabel)}</button>` : ''}</div></form>`;
  const form = dlg.querySelector('form');
  if (onInput) form.addEventListener('input', ev => onInput(form, ev));
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    for (const k in data) if (typeof data[k] === 'string') data[k] = data[k].trim();
    const r = submit ? await submit(data, form) : true;
    if (r !== false) dlg.close();
  });
  if (!dlg.open) dlg.showModal();
  return form;
}
function fileToJpeg(file, max = 1200) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Image illisible')); };
    img.src = url;
  });
}

    <button class="btn blue" data-act="stockMove" data-id="${a.id}" data-t="set">${ic('checklist')} Inventaire</button></div></div>`; }).join('');
}
function addMove(a, type, qty, after, note) {
  const now = toInput(new Date());
  S.moves.push({ id: uid(), itemId: a.id, itemName: a.name, unit: a.unit, type, qty, before: a.qty, after, note: note || '', at: now, by: S.currentUser });
  a.qty = after; a.updatedAt = now; a.updatedBy = S.currentUser;
}
function regData(kind, inR) {
  if (kind === 'temp') {
    const items = S.temps.filter(t => inR(t.at)).sort((a, b) => b.at.localeCompare(a.at));
    return { title: 'Relevés de température', items, head: ['Date', 'Équipement', 'Température (°C)', 'Limite', 'Conformité', 'Action corrective', 'Par'],
      rows: items.map(t => [fmtFull(t.at), t.equipName, fmtQ(t.value), `${t.kind === 'hot' ? '≥' : '≤'} ${fmtQ(t.limit)} °C`, t.ok ? 'Conforme' : 'HORS LIMITE', t.action, t.by]) };
  }
  if (kind === 'cool') {
    const items = S.cooling.filter(c => c.status === 'done' && inR(c.startAt)).sort((a, b) => b.startAt.localeCompare(a.startAt));
    return { title: 'Registre des refroidissements', items, head: ['Préparation', 'Début', 'T° début (°C)', 'Fin', 'T° fin (°C)', 'Durée (min)', 'Conformité', 'Action corrective', 'Par'],
      rows: items.map(c => [c.product, fmtFull(c.startAt), fmtQ(c.startTemp), fmtFull(c.endAt), fmtQ(c.endTemp), c.minutes, c.ok ? 'Conforme' : 'NON CONFORME', c.action, c.endBy || c.by]) };
  }
  if (kind === 'oil') {
    const items = S.oil.filter(o => inR(o.at)).sort((a, b) => b.at.localeCompare(a.at));
    return { title: 'Registre des huiles de friture', items, head: ['Date', 'Friteuse', 'Composés polaires (%)', 'Décision', 'Par'],
      rows: items.map(o => [fmtFull(o.at), o.fryer, o.polar === '' ? '' : fmtQ(o.polar), o.action, o.by]) };
  }
  if (kind === 'stock') {
    const items = S.moves.filter(m => inR(m.at)).sort((a, b) => b.at.localeCompare(a.at));
    return { title: 'Mouvements de stock', items, noDel: true, head: ['Date', 'Article', 'Mouvement', 'Quantité', 'Stock avant', 'Stock après', 'Motif', 'Par'],
      rows: items.map(m => [fmtFull(m.at), m.itemName, MOVE[m.type], (m.type === 'out' ? '-' : m.type === 'in' ? '+' : '') + fmtQ(m.qty) + ' ' + m.unit, fmtQ(m.before), fmtQ(m.after), m.note, m.by]) };
  }
  if (kind === 'lab') {
    const items = S.labels.filter(l => inR(l.at)).sort((a, b) => b.at.localeCompare(a.at));
    return { title: 'Registre des étiquettes', items, head: ['Date', 'Produit', 'Remarque', 'Par'],
      extra: l => `<button class="btn sm" data-act="photo" data-id="${l.photoId}">${ic('image')}</button> `,
      rows: items.map(l => [fmtFull(l.at), l.product, l.note, l.by]) };
  }
  if (kind === 'dlc') {
    const items = S.dlc.filter(e => inR(e.madeAt)).sort((a, b) => b.madeAt.localeCompare(a.madeAt));
    const stat = e => e.status === 'active' ? 'En cours' : (e.status === 'used' ? 'Terminé' : 'Jeté') + ` le ${fmtFull(e.closedAt)} par ${e.closedBy}` + (e.closeNote ? ` (${e.closeNote})` : '');
    return { title: 'Registre de datation', items, head: ['Produit', 'Opération', 'Date', 'À consommer jusqu\'au', 'Lot', 'Remarque', 'Par', 'Statut'],
      rows: items.map(e => [e.product, e.type, fmtFull(e.madeAt), fmtFull(e.expiresAt), e.lot, e.note, e.by, stat(e)]) };
  }
  if (kind === 'rec') {
    const items = S.receptions.filter(r => inR(r.at)).sort((a, b) => b.at.localeCompare(a.at));
    return { title: 'Registre de réception', items, head: ['Date', 'Fournisseur', 'Produit', 'N° lot', 'DLC / DDM', 'Quantité', 'T° (°C)', 'Seuil appliqué', 'Conformité', 'Action corrective', 'Par'],
      extra: r => r.photoId ? `<button class="btn sm" data-act="photo" data-id="${r.photoId}">${ic('image')}</button> ` : '',
      rows: items.map(r => [fmtFull(r.at), r.supplier, r.product, r.lot, r.dlc ? `${r.dlcType} ${fmtDay(r.dlc)}` : '', r.qty, r.temp, r.tcat ? `${r.tcat} (${r.tlimit})` : '', r.conform ? 'Conforme' : 'NON CONFORME', r.action, r.by]) };
  }
  const items = S.cleanLog.filter(l => inR(l.date)).sort((a, b) => b.at.localeCompare(a.at));
  return { title: 'Registre de nettoyage', items, head: ['Date', 'Tâche', 'Zone', 'Fréquence', 'Fait par'],
    rows: items.map(l => [fmtFull(l.at), l.taskName, l.zone, FREQ[l.freq] || '', l.by]) };
}

function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
async function restore(file) {
  try {
    const j = JSON.parse(await file.text());
    if (j.app !== 'haccp-resto' || !j.state || !Array.isArray(j.state.dlc)) throw new Error('Ce fichier n\'est pas une sauvegarde de l\'application.');
    if (!confirm(`Remplacer toutes les données de la tablette par la sauvegarde du ${fmtDay(j.exportedAt)} ?`)) return;
    S = Object.assign(DEFAULTS(), j.state);
    await idb.clear('photos'); for (const k in (j.photos || {})) await idb.set('photos', k, j.photos[k]);
    migrate(); await save(); toast('Sauvegarde restaurée'); lock();
  } catch (e) { alert('Restauration impossible : ' + e.message); }
}

        const al = ALLERGENS.filter(([k]) => v['a_' + k]).map(([k]) => k);
        const o = { name: v.name, cat: v.cat, al, note: v.note || '', updatedAt: toInput(new Date()), updatedBy: S.currentUser };
        if (x) Object.assign(x, o); else S.dishes.push({ id: uid(), ...o });
        commit('Plat enregistré ✓');
      }) : undefined,
    });
    if (edit) $('#dlg .scroll').insertAdjacentHTML('beforeend', `<h3>Allergènes présents</h3><div class="agrid">${ALLERGENS.map(([k, l]) =>
      `<label class="achip"><input type="checkbox" name="a_${k}" ${cur.includes(k) ? 'checked' : ''}> ${esc(l)}</label>`).join('')}</div>
      <label class="f">Remarque <span class="h">– facultatif (ex. sans gluten sur demande)</span><input name="note" value="${esc(x ? x.note : '')}"></label>
      ${x ? `<p><button type="button" class="btn sm danger" data-act="delDish" data-id="${x.id}">${ic('trash')} Supprimer ce plat</button></p>` : ''}`);
  },
  delDish(d) {
    const x = S.dishes.find(i => i.id === d.id);
    if (!x || !confirm(`Supprimer « ${x.name} » de la liste des allergènes ?`)) return;
    S.dishes = S.dishes.filter(i => i !== x); $('#dlg').close(); commit('Plat supprimé');
  },

  editEquip(d) {
    const e = S.equip.find(x => x.id === d.id);
    openForm({ title: e ? 'Modifier l\'équipement' : 'Nouvel équipement', fields: [
      { name: 'name', label: 'Nom', value: e ? e.name : '', required: true },
      { name: 'kind', label: 'Type', type: 'select', options: Object.entries(EQ_KIND), value: e ? e.kind : 'cold', half: true },
      { name: 'limit', label: 'Limite (°C)', hint: 'maximum pour le froid, minimum pour le chaud', type: 'number', value: e ? e.limit : 4, attrs: 'step="0.5" inputmode="decimal"', required: true, half: true }],
      submit(v) { const o = { name: v.name, kind: v.kind, limit: Number(v.limit) }; if (e) Object.assign(e, o); else S.equip.push({ id: uid(), ...o }); commit(); } });
  },
  delEquip(d) { if (!confirm('Retirer cet équipement ? Les relevés restent au registre.')) return; S.equip = S.equip.filter(x => x.id !== d.id); commit(); },
  editRule(d) {
    const r = S.tempRules.find(x => x.id === d.id);
    openForm({ title: r ? 'Modifier le seuil' : 'Nouveau seuil de température', fields: [
      { name: 'name', label: 'Catégorie de produit', value: r ? r.name : '', required: true },
      { name: 'type', label: 'Type de limite', type: 'select', options: [['max', 'Maximum'], ['min', 'Minimum'], ['none', 'Pas de contrôle']], value: r ? r.type : 'max', half: true },
      { name: 'limit', label: 'Limite (°C)', type: 'number', value: r ? r.limit : 4, attrs: 'step="0.5" inputmode="decimal"', half: true }],
      submit(v) { const o = { name: v.name, type: v.type, limit: Number(v.limit) || 0 }; if (r) Object.assign(r, o); else S.tempRules.push({ id: uid(), ...o }); commit(); } });
  },
  delRule(d) { if (!confirm('Retirer ce seuil ?')) return; S.tempRules = S.tempRules.filter(x => x.id !== d.id); commit(); },

  newProfile() {
    if (!isAdmin()) return;
    openForm({
      title: 'Nouveau profil',
      html: '<p class="small muted" style="margin-top:0">Choisissez ce que ce profil peut faire dans chaque catégorie. Un administrateur a tous les droits.</p>',
      fields: [
        { name: 'name', label: 'Prénom', required: true, half: true },
        { name: 'role', label: 'Rôle', type: 'select', options: [['user', 'Équipier'], ['admin', 'Administrateur']], value: 'user', half: true },
        { name: 'pw', label: 'Mot de passe', hint: '4 caractères minimum', type: 'password', attrs: PW_ATTRS, required: true, half: true },
        { name: 'pw2', label: 'Confirmer', type: 'password', attrs: PW_ATTRS, required: true, half: true },
        { ...presetField(), value: 'cuisine' }, ...permFields(PRESETS.cuisine[1])],
      onInput(f, ev) { presetInput(f, ev); roleInput(f); },
      async submit(v) {
        if (S.profiles.some(p => p.name.toLowerCase() === v.name.toLowerCase())) { alert('Ce profil existe déjà.'); return false; }
        if (v.pw !== v.pw2) { alert('Les deux mots de passe sont différents.'); return false; }
        const p = { id: uid(), name: v.name, role: v.role, ...await makePw(v.pw) };
        if (v.role !== 'admin') p.perms = readPerms(v);
        S.profiles.push(p); commit('Profil créé ✓');
      } });
  },
  editPerms(d) {
    const p = S.profiles.find(x => x.id === d.id); if (!p || !isAdmin()) return;
    const self = p.name === S.currentUser;
    if (self) return openForm({ title: 'Droits de ' + p.name, cancelLabel: 'Fermer', html: '<p style="margin-top:0">Vous êtes administrateur : vous avez tous les droits. Pour limiter un profil, ouvrez les droits d\'un autre membre de l\'équipe.</p>' });
    const f = openForm({
      title: 'Droits de ' + p.name,
      html: '<p class="small muted" style="margin-top:0">Définissez ce que ce profil peut faire dans chaque catégorie.</p>',
      fields: [{ name: 'role', label: 'Rôle', type: 'select', options: [['user', 'Équipier'], ['admin', 'Administrateur']], value: p.role }, presetField(), ...permFields(permsOf(p))],
      onInput(f, ev) { presetInput(f, ev); roleInput(f); },
      submit(v) {
        if (p.role === 'admin' && v.role !== 'admin' && S.profiles.filter(x => x.role === 'admin').length < 2) { alert('Il doit rester au moins un administrateur.'); return false; }
        p.role = v.role; if (v.role !== 'admin') p.perms = readPerms(v);
        commit('Droits mis à jour ✓');
      } });
    roleInput(f);
  },
  newRec() {
    if (!needUser()) return;
    const rules = S.tempRules;
    openForm({
      title: 'Nouvelle réception',
      html: '<div id="rHint" class="note" hidden></div>',
      fields: [
        { name: 'supplier', label: 'Fournisseur', required: true, list: S.suppliers, half: true },
        { name: 'product', label: 'Produit', required: true, list: [...new Set(S.receptions.map(r => r.product))].slice(-80), half: true },
        { name: 'lot', label: 'N° de lot', half: true },
        { name: 'qty', label: 'Quantité', hint: 'ex. 5 kg, 2 colis', half: true },
        { name: 'dlcType', label: 'Type de date', type: 'select', options: ['DLC', 'DDM'], value: 'DLC', half: true },
        { name: 'dlc', label: 'Date limite', type: 'date', half: true },
        ...(rules.length ? [{ name: 'tcat', label: 'Catégorie de température', type: 'select', options: rules.map(r => [r.id, `${r.name} (${ruleTxt(r)})`]), value: rules[0].id }] : []),
        { name: 'temp', label: 'Température à réception (°C)', hint: 'produits frais / surgelés', type: 'number', attrs: 'step="0.1" inputmode="decimal"', half: true },
        { name: 'conform', label: 'Contrôle', type: 'select', options: [['1', 'Conforme'], ['0', 'Non conforme']], value: '1', half: true },
        { name: 'action', label: 'Anomalie et action corrective', hint: 'obligatoire si non conforme (ex. colis refusé)', type: 'textarea' },
        { name: 'photo', label: 'Photo de l\'étiquette', hint: 'facultatif', type: 'photo' },
      ],
      onInput(f) {
        const r = f.tcat && rules.find(x => x.id === f.tcat.value), msgs = recIssues(r, f.temp.value, f.dlcType.value, f.dlc.value);
        const h = $('#rHint'), prev = f.dataset.auto || '';
        if (msgs.length) {
          const auto = 'Non-conformité : ' + msgs.join(' ; ') + '. Action : ';
          h.hidden = false; h.textContent = 'Non-conformité détectée : ' + msgs.join(' ; ') + '. Le produit doit être refusé ou isolé.';
          f.conform.value = '0'; if (!f.action.value || f.action.value === prev) f.action.value = auto; f.dataset.auto = auto;
        } else {
          h.hidden = true;
          if (prev && f.action.value === prev) { f.action.value = ''; f.conform.value = '1'; }
          f.dataset.auto = '';
        }
      },
      async submit(v, f) {
        const r = rules.find(x => x.id === v.tcat), msgs = recIssues(r, v.temp, v.dlcType, v.dlc);
        if (v.conform === '0' && (!v.action || /Action :\s*$/.test(v.action))) { alert('Indiquez l\'anomalie et l\'action corrective.'); return false; }
        if (v.conform === '1' && msgs.length && !confirm('Attention : ' + msgs.join(' ; ') + '.\nEnregistrer quand même comme CONFORME ?')) return false;
        let photoId = '';
        const file = f.photo.files[0];
        if (file) { try { photoId = uid(); await idb.set('photos', photoId, await fileToJpeg(file)); } catch (e) { photoId = ''; alert('La photo n\'a pas pu être enregistrée : ' + e.message); } }
        S.receptions.push({ id: uid(), at: toInput(new Date()), supplier: v.supplier, product: v.product, lot: v.lot, qty: v.qty, dlcType: v.dlcType, dlc: v.dlc, temp: v.temp,
          tcat: r ? r.name : '', tlimit: r ? ruleTxt(r) : '', conform: v.conform === '1', action: v.action, photoId, by: S.currentUser });
        if (!S.suppliers.includes(v.supplier)) S.suppliers.push(v.supplier);
        commit('Réception enregistrée ✓');
      },
    });
  },
});
/* ---------- Événements ---------- */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const fn = actions[el.dataset.act]; if (!fn) return;
  if (!allowed(el.dataset.act, el.dataset)) return toast('Accès non autorisé pour votre profil', true);
  fn(el.dataset, el);
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'recSearch') { ui.search = ev.target.value; $('#recList').innerHTML = recList(); }
  if (ev.target.id === 'stockSearch') { ui.stockSearch = ev.target.value; $('#stockList').innerHTML = stockList(); }
  if (ev.target.id === 'allSearch') { ui.allSearch = ev.target.value; $('#allList').innerHTML = allList(); }
  if (ev.target.id === 'labSearch') { ui.labSearch = ev.target.value; $('#labList').innerHTML = labList(); loadThumbs(); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'regFrom' && t.value) { ui.from = t.value; render(); }
  if (t.id === 'regTo' && t.value) { ui.to = t.value; render(); }
  if (t.id === 'restore' && t.files[0]) { restore(t.files[0]); t.value = ''; }
  if (t.id === 'labCam' && t.files[0]) saveLabelPhoto(t.files[0]);
});
$('#dlg').addEventListener('cancel', ev => { if (!S.currentUser) ev.preventDefault(); });
// Anciennes données : les prénoms de l'équipe deviennent des profils (mot de passe à définir par l'administrateur).
function migrate() {
  if (!S.profiles.length && S.staff.length) S.profiles = S.staff.map(n => ({ id: uid(), name: n, role: 'user', salt: '', hash: '' }));
  S.staff = []; S.currentUser = ''; role = '';
}

/* ---------- Démarrage ---------- */
(async () => {
  try { const st = await idb.get('kv', 'state'); if (st) S = Object.assign(DEFAULTS(), st); }
  catch (e) { alert('Impossible de lire les données enregistrées : ' + e); }
  migrate(); restoreSession(); render(); if (!S.currentUser) actions.pickUser();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  setInterval(() => { if (!$('#dlg').open && !['set', 'reg', 'rec', 'lab', 'stock', 'all'].includes(ui.view)) render(); }, 60000);
})();
</script>
</body>
</html>
